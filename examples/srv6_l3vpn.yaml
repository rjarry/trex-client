#
# name: SRv6 L3VPN (H.Encaps / End.DT4)
#
# Asymmetric SRv6 L3VPN profile (modeled on smoke/srv6_test.sh):
#   direction 0 (TRex port 0 -> grout p0): plain IPv4 packet toward the remote
#     site; grout H.Encaps it into SRv6 and sends the IPv6 packet out p1;
#   direction 1 (TRex port 1 -> grout p1): SRv6 packet destined to grout's local
#     End.DT4 SID with an inner IPv4 packet; grout decapsulates and routes the
#     inner IPv4 out p0.
#
# Ingress direction 0 is a 64-byte IPv4 frame; ingress direction 1 is
# Ether(14) + IPv6(40) + IPv4(20) + UDP(8) = 82 bytes.
# A field-engine variable sweeps the UDP source port to spread the traffic.
- direction: 0
  packet:
    layers:
      - eth: {src: "02:00:00:00:01:00", dst: "02:00:00:00:00:00"}
      - ip: {src: 16.0.0.1, dst: 48.0.0.1}
      - udp: {sport: 1024, dport: 1024, chksum: 0}
    payload_size: 18
  mode: {type: continuous, rate: {type: percentage, value: 100}}
  vm:
    - flow_var: {name: sport, op: inc, min: 1024, max: 65535, size: 2}
    - write_flow_var: {name: sport, offset: UDP.sport}
- direction: 1
  packet:
    layers:
      - eth: {src: "02:00:00:00:01:01", dst: "02:00:00:00:00:01"}
      - ipv6: {src: "fd00:1::2", dst: "fd00:a::1"}
      - ip: {src: 48.0.0.1, dst: 16.0.0.1}
      - udp: {sport: 1024, dport: 1024, chksum: 0}
  mode: {type: continuous, rate: {type: percentage, value: 100}}
  vm:
    - flow_var: {name: sport, op: inc, min: 1024, max: 65535, size: 2}
    - write_flow_var: {name: sport, offset: UDP.sport}
