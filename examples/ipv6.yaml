#
# name: IPv6 forwarding
#
# 64-byte IPv6/UDP frames, fd00:100::/64 <-> fd00:200::/64.
# Ether(14) + IPv6(40) + UDP(8) = 62 bytes, padded to 66 on the wire.
# A field-engine variable sweeps the UDP source port to spread the traffic over
# many flows.
- direction: 0
  packet:
    layers:
      - eth: {src: "02:00:00:00:01:00", dst: "02:00:00:00:00:00"}
      - ipv6: {src: "fd00:100::1", dst: "fd00:200::1"}
      - udp: {sport: 1024, dport: 1024}
  mode: {type: continuous, rate: {type: percentage, value: 100}}
  vm:
    - flow_var: {name: sport, op: inc, min: 1024, max: 65535, size: 2}
    - write_flow_var: {name: sport, offset: UDP.sport}
- direction: 1
  packet:
    layers:
      - eth: {src: "02:00:00:00:01:01", dst: "02:00:00:00:00:01"}
      - ipv6: {src: "fd00:200::1", dst: "fd00:100::1"}
      - udp: {sport: 1024, dport: 1024}
  mode: {type: continuous, rate: {type: percentage, value: 100}}
  vm:
    - flow_var: {name: sport, op: inc, min: 1024, max: 65535, size: 2}
    - write_flow_var: {name: sport, offset: UDP.sport}
