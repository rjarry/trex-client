#
# name: VXLAN L2VPN, IPv6 underlay
#
# Same asymmetric L2VPN profile as vxlan_l2vpn_ipv4 but with an IPv6 underlay
# (outer IPv6 header). The inner customer traffic stays IPv4.
#
#   direction 0 (TRex port 0 -> grout p0): VXLAN frame, grout decaps and bridges
#     the inner Ethernet frame out the access port p1;
#   direction 1 (TRex port 1 -> grout p1): plain Ethernet frame, grout bridges it
#     into the tunnel and VXLAN-encaps it out p0.
#
# Flow spreading:
#   - decap direction: the outer VXLAN UDP source port is swept. Over an IPv6
#     underlay grout verifies the outer UDP checksum, so checksum_sweep keeps it
#     valid in lockstep: each +1 on the source port cancels a -1 on the
#     one's-complement checksum, stopping before the end-around carry wraps;
#   - encap direction: the customer UDP source port is swept; grout derives the
#     outer VXLAN source port from the inner flow hash.
- direction: 0
  packet:
    layers:
      - eth: {src: "02:00:00:00:01:00", dst: "02:00:00:00:00:00"}
      - ipv6: {src: "fd00:0::2", dst: "fd00:0::1"}
      - udp: {sport: 1024, dport: 4789}
      - vxlan: {vni: 100}
      - eth: {src: "02:00:00:00:0c:00", dst: "02:00:00:00:0c:01"}
      - ip: {src: 16.0.0.1, dst: 48.0.0.1}
      - udp: {sport: 1024, dport: 1024, chksum: 0}
    payload_size: 18
  mode: {type: continuous, rate: {type: percentage, value: 100}}
  vm:
    - checksum_sweep: {offset: UDP.sport, checksum: UDP.chksum, min: 1024}
- direction: 1
  packet:
    layers:
      - eth: {src: "02:00:00:00:0c:01", dst: "02:00:00:00:0c:00"}
      - ip: {src: 48.0.0.1, dst: 16.0.0.1}
      - udp: {sport: 1024, dport: 1024, chksum: 0}
    payload_size: 18
  mode: {type: continuous, rate: {type: percentage, value: 100}}
  vm:
    - flow_var: {name: sport, op: inc, min: 1024, max: 65535, size: 2}
    - write_flow_var: {name: sport, offset: UDP.sport}
