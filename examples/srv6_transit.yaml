#
# name: SRv6 transit (End)
#
# IPv6 packets carrying an SRH whose active segment is one of grout's local End
# SIDs, with one segment still left. The SRH segment list is stored in reverse on
# the wire, so segments[0] is the next segment and segments[1] is grout's SID
# (the current destination). grout runs End: Segments Left 1 -> 0, the outer
# destination becomes the next segment, and the packet is forwarded out the
# opposite port. The two directions use different SIDs and next segments.
#
# Ether(14) + IPv6(40) + SRH(8 + 2*16) + UDP(8) = 102 bytes on the wire.
# A field-engine variable sweeps the UDP source port to spread the traffic.
- direction: 0
  packet:
    layers:
      - eth: {src: "02:00:00:00:01:00", dst: "02:00:00:00:00:00"}
      - ipv6: {src: "fd00:100::1", dst: "fd00:e0::1"}
      - srh: {segments: ["fd00:200::1", "fd00:e0::1"], segleft: 1}
      - udp: {sport: 1024, dport: 1024}
  mode: {type: continuous, rate: {type: percentage, value: 100}}
  vm:
    - flow_var: {name: sport, op: inc, min: 1024, max: 65535, size: 2}
    - write_flow_var: {name: sport, offset: UDP.sport}
- direction: 1
  packet:
    layers:
      - eth: {src: "02:00:00:00:01:01", dst: "02:00:00:00:00:01"}
      - ipv6: {src: "fd00:200::1", dst: "fd00:e1::1"}
      - srh: {segments: ["fd00:100::1", "fd00:e1::1"], segleft: 1}
      - udp: {sport: 1024, dport: 1024}
  mode: {type: continuous, rate: {type: percentage, value: 100}}
  vm:
    - flow_var: {name: sport, op: inc, min: 1024, max: 65535, size: 2}
    - write_flow_var: {name: sport, offset: UDP.sport}
